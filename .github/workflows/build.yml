name: 打包

on:
  push:
    branches: ['**']       # 任何分支的提交都构建
    tags: ['v*']           # 打 v 开头的 tag 也构建：git tag v1.0 && git push origin v1.0
  release:
    # 网页上「Publish release」时顺带创建的 tag 走的是 release 事件，不是 push 事件，
    # 想从网页发版就得单独挂上这个；命令行推 tag 走上面的 push 就行
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20      # 界面自检万一卡住，别把 job 挂满 6 小时
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装打包工具
        run: pip install -r requirements.txt

      - name: 自检
        run: python selfcheck.py
        env:
          # macOS runner 没有桌面会话，Tk 会卡在等窗口可见；逻辑部分照常跑
          BTDEPLOY_SKIP_GUI: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: 打包
        run: python build.py

      # .app 是个目录，直接传 artifact 会丢内部符号链接和权限，先压成 zip
      - name: 压缩 .app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/bt-deploy.app dist/bt-deploy-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bt-deploy-${{ matrix.os }}
          path: |
            dist/bt-deploy.exe
            dist/bt-deploy-macos.zip
          if-no-files-found: error

  release:
    needs: build
    # 只有 v* tag（命令行推 tag 或网页发版）才建 Release，分支提交和手动触发都不建
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # 建 Release、传 asset 都要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true     # 两个平台的包平铺到一个目录
      - uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*'
          generate_release_notes: true