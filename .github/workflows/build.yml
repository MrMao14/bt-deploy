name: 打包

on:
  push:
    branches: ['**']       # 任何分支推送只跑测试打包，不建 Release
    tags: ['v*', 'V*']     # 兼容小写 v 与大写 V（如 v1.0.0 和 V1.0.0）
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20      # 界面自检万一卡住，别把 job 挂满 6 小时
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装打包工具
        run: pip install -r requirements.txt

      - name: 自检
        run: python selfcheck.py
        env:
          # macOS runner 没有桌面会话，Tk 会卡在等窗口可见；逻辑部分照常跑
          BTDEPLOY_SKIP_GUI: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: 打包
        run: python build.py

      # macOS 创建无需解压的 .dmg 磁盘镜像，挂载后直接拖入应用程序运行
      - name: 制作 macOS DMG 镜像
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "宝塔部署助手" -srcfolder dist/bt-deploy.app -ov -format UDZO dist/bt-deploy.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: bt-deploy-${{ matrix.os }}
          path: |
            dist/bt-deploy.exe
            dist/bt-deploy.dmg
          if-no-files-found: error

  release:
    needs: build
    # 只要是 tag 推送（无论小写 v 还是大写 V），就自动创建并发布 Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # 建 Release、传 asset 都要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true     # 两个平台的包平铺到一个目录
      - uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*'
          generate_release_notes: true